services:
  - type: web
    name: bhanpura-csc-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DB_PATH
        value: ./data/csc.db
      # Email notifications (Brevo or SMTP). Set these in the Render dashboard.
      - key: BREVO_API_KEY
        sync: false
      - key: NOTIFY_TO
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        sync: false
